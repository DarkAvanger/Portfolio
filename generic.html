                            <h3>Biped Robot Rig - Video Game</h3>
                            
                            <!-- Added flex-start here to align the first paragraph with the top of the image -->
                            <div class="project-row" style="margin-bottom: 5em; align-items: flex-start;">
                                <img src="images/robot-rig.png" alt="Not My War Rig Image 1" class="project-img">
                                <div class="text-content">
                                    <p class="justify-text">In this project, I was responsible for developing the rig for a bipedal robot and various props compatible with Unreal Engine for the video game Not My War. During development, my role transitioned to solving any technical difficulties and asset compatibility issues when integrating them into Unreal, as well as optimizing rigs.</p>
                                    
                                    <!-- Added your small image here! -->
                                    <img src="images/24Logo.jfif" alt="Additional Rig Detail" style="max-width: 175px; border-radius: 8px; margin-top: 1.5em; display: block; margin-left: auto;">
                                </div>

                            <div class="project-row reverse" style="align-items: flex-start;">

                                    <img src="images/nodeSetUp-Robot.png" alt="Not My War Rig Image 2" style="width: 100%; border-radius: 8px;">
                                    
<!-- Keep this pushed to the left edge! -->
<pre style="border-radius: 8px; margin-top: 0; margin-bottom: 0;"><code class="language-mel">float $t = time * tube_l_ctr.vibrationSpeed;  

tubeCtr_l_vibration.translateX = noise($t) * tube_l_ctr.vibrationAmount;
tubeCtr_l_vibration.translateY = noise($t + 1) * tube_l_ctr.vibrationAmount * 0.5;
tubeCtr_l_vibration.translateZ = noise($t + 2) * tube_l_ctr.vibrationAmount;</code></pre>

                                </div>
                                
                                <div class="text-content">
                                    <p class="justify-text">Beyond the main rig, a major focus for this character was automating secondary motion. Animating continuous, high-frequency mechanical jitter by hand is tedious and difficult to iterate on. To solve this, I developed a lightweight procedural animation system directly integrated into the rig to handle the vibration of the robot's external tubes.</p>
                                    
                                    <p class="justify-text">The setup, shown in the node network and the expression used below, is a simple but highly efficient solution. It utilizes the Maya playback timeslider to drive a noise function, generating a continuous, randomized offset. By passing this time variable into the translation channels of the tube controls, the rig automatically animates itself whenever the timeline plays. I also added the vibrationSpeed and vibrationAmount as attributes, allowing animators full art direction over the intensity of the effect without needing to plot a single keyframe.</p>
                                </div>
