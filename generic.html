            <script>
                const projectData = {
                    "not-my-war": {
                        title: "Not My War",
                        banner: "", 
                        video: "https://player.vimeo.com/video/1193275308?title=0&byline=0&portrait=0", 
                        content: `
                            <h3>Rigging Supervisor</h3>
                            <p>Ensured asset compatibility for the Steam release. Detailed pipeline breakdowns go here.</p>
                        `
                    },
                    "arachnoid": {
                        title: "Arachnoid Robot Rig",
                        banner: "", 
                        video: "https://player.vimeo.com/video/1193275308?title=0&byline=0&portrait=0", 
                        content: `
                            <p>Six-legged creature proxy geometry workflow and rigging setup designed for complex mechanical movement.</p>
                            <p>Here I used Python to automate the leg IK setup...</p>
                        `
                    },
                    "biped-rig": {
                        title: "Biped Creature Rig",
                        banner: "", 
                        video: "https://player.vimeo.com/video/1193275308?title=0&byline=0&portrait=0",
                        content: `
                            <p>Custom skeletal hierarchy optimized for Unreal Engine 5.</p>
                        `
                    },
                    "auto-rigger": {
                        title: "Python Auto-Rigger Tool",
                        banner: "", 
                        video: "https://player.vimeo.com/video/1193275308?title=0&byline=0&portrait=0",
                        content: `
                            <p>This script automates joint placement and control generation in Maya...</p>
                        `
                    },
                    "weight-painting": {
                        title: "Weight Painting Utility",
                        banner: "", 
                        video: "https://player.vimeo.com/video/1193275308?title=0&byline=0&portrait=0",
                        content: `
                            <p>Custom UI tool to streamline skin weight mirroring and smoothing.</p>
                        `
                    },
                    "engine-exporter": {
                        title: "Engine Exporter",
                        banner: "", // add asset here
                        video: "https://player.vimeo.com/video/1193275308?title=0&byline=0&portrait=0",
                        content: `
                            <p>One-click batch exporter for Unity and Unreal Engine integration.</p>
                        `
                    }
                };

                const urlParams = new URLSearchParams(window.location.search);
                const projectId = urlParams.get('id');

                if (projectId && projectData[projectId]) {
                    const project = projectData[projectId];
                    
                    document.getElementById("project-title").innerText = project.title;

                    const bannerContainer = document.getElementById("project-banner-container");

                    if (project.banner && project.banner.trim() !== "") {
                        bannerContainer.style.backgroundImage = "url('" + project.banner + "')";
                        bannerContainer.style.display = "block";
                    } else {
                        bannerContainer.style.display = "none";
                    }
                    
                    const videoContainer = document.getElementById("project-video-container");
                    const videoElement = document.getElementById("project-video");
                    
                    if (project.video && project.video.trim() !== "") {
                        videoElement.src = project.video;
                        videoContainer.style.display = "block";
                    } else {
                        videoContainer.style.display = "none";
                    }
                    
                    document.getElementById("project-content").innerHTML = project.content;
                } else {
                    document.getElementById("project-title").innerText = "Project Not Found";
                    document.getElementById("project-content").innerHTML = "<p>Please return to the portfolio page and select a valid project.</p>";
                }
            </script>
